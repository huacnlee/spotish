# Packages Spotish for macOS, Linux and Windows. A tag `vX.Y.Z` publishes them as a GitHub release; running it by
# hand only builds them (workflow artifacts). The installers' asset names carry no version, so
# `releases/latest/download/<asset>`, which install.sh and install.ps1 use, always resolves. The versioned archives
# and `latest.json` beside them are what the app's updater (`nsh.json` "updater") fetches.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  package:
    name: package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux, os: ubuntu-24.04, asset: spotish-linux-x86_64.tar.gz, installer: website/public/install.sh }
          - { target: macos, os: macos-15, asset: spotish-macos-arm64.zip, installer: website/public/install.sh }
          - { target: windows, os: windows-latest, asset: spotish-windows-x86_64.zip, installer: website/public/install.ps1 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # QuickJS is C (bindgen needs libclang); the Linux host links GTK 4 and GStreamer (NSH's audio).
      - name: Install clang, GTK 4 and GStreamer
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # For now the CLI is built from the NSH commit Cargo.lock holds, not installed from the nightly: the nightly
      # trails NSH's main, and the release needs fixes it does not have yet. Once a nightly (or a release) carries the
      # locked commit, go back to installing it, as CI does (https://nsh.dev/docs/installation).
      - name: Build the NSH CLI from the locked commit
        run: .github/scripts/nsh-from-source.sh

      # The hosts the CLI generates call the API of the commit it was built from, and the app's crate links the one
      # Cargo.lock holds (see CONTRIBUTING.md). Built from the lock, they agree; the check stays for when the CLI
      # comes from the nightly again, which can part from the lock: a release then stops, a run by hand only warns.
      - name: Compare the CLI with the locked NSH
        run: |
          # Windows checkouts may end lines with CRLF.
          cli="$(nsh --version | tr -d '\r' | sed -n 's/.*(\([0-9a-f]*\)).*/\1/p')"
          locked="$(tr -d '\r' < Cargo.lock | grep -A2 '^name = "nsh-core"$' | sed -n 's/^source = ".*#\([0-9a-f]*\)"$/\1/p')"
          echo "nsh CLI: $cli, Cargo.lock: $locked"
          [ -n "$cli" ] && [ -n "$locked" ] || { echo "::error::Could not read the CLI or the locked NSH commit."; exit 1; }
          case "$locked" in
            "$cli"*) ;;
            *)
              message="The nightly nsh CLI ($cli) is not the NSH commit Cargo.lock holds ($locked); run cargo update -p nsh-core --precise <nightly hash>."
              if [ "$GITHUB_REF_TYPE" = tag ]; then echo "::error::$message"; exit 1; fi
              echo "::warning::$message" ;;
          esac

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          args=(--build "$GITHUB_RUN_NUMBER")
          [ "$GITHUB_REF_TYPE" != tag ] || args+=(--app-version "${GITHUB_REF_NAME#v}")
          out="$RUNNER_TEMP/out"
          mkdir -p assets
          nsh package --target "$TARGET" -o "$out" "${args[@]}"
          ls -l "$out"
          # The installers' archive, and the versioned one for the updater.
          case "$TARGET" in
            linux) mv "$out/Spotish.tar.gz" "assets/$ASSET"; mv "$out"/Spotish-*.tar.gz assets/ ;;
            windows) mv "$out/Spotish.zip" "assets/$ASSET"; mv "$out"/Spotish-*.zip assets/ ;;
            macos) ditto -c -k --keepParent "$out/Spotish.app" "assets/$ASSET"; mv "$out"/Spotish-*.tar.gz assets/ ;;
          esac
          ls -l assets

      - name: Verify the macOS package
        if: matrix.target == 'macos'
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          app="$RUNNER_TEMP/verify/Spotish.app"
          ditto -x -k "assets/$ASSET" "$RUNNER_TEMP/verify"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64
          codesign --verify --deep --strict "$app"

      # The installer, run against this package served locally.
      - name: Try the installer on this package
        env:
          ASSET: ${{ matrix.asset }}
          INSTALLER: ${{ matrix.installer }}
        run: |
          (cd assets && { command -v sha256sum > /dev/null && sha256sum "$ASSET" || shasum -a 256 "$ASSET"; } > sha256sums)
          python=python3; command -v python3 > /dev/null || python=python
          (cd assets && exec "$python" -m http.server 8765 > /dev/null 2>&1) &
          server=$!
          trap 'kill "$server" 2> /dev/null || true' EXIT
          sleep 2
          export SPOTISH_BASE_URL=http://127.0.0.1:8765
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -ExecutionPolicy Bypass -File "$INSTALLER"
              test -f "$LOCALAPPDATA/Programs/Spotish/Spotish.exe" ;;
            macOS)
              bash "$INSTALLER"
              codesign --verify --deep --strict /Applications/Spotish.app ;;
            Linux)
              bash "$INSTALLER"
              test -x "$HOME/.local/share/spotish/Spotish"
              test -x "$HOME/.local/bin/spotish"
              ls "$HOME"/.local/share/applications/*.desktop ;;
          esac
          rm assets/sha256sums

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: assets/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and GTK 4
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-publish
      - name: Build the NSH CLI from the locked commit
        run: .github/scripts/nsh-from-source.sh
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # Release file names are lowercase (nsh names the updater's archives after the app, Spotish-<version>-...).
      - name: Lowercase asset names
        run: |
          cd assets
          for f in *; do l=$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]'); [ "$f" = "$l" ] || mv "$f" "$l"; done
          ls -l
      # The app fetches `releases/latest/download/latest.json` and the versioned archives it names (nsh/updater).
      - name: Write the update manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg version "$version" '.version = $version' nsh.json > "$RUNNER_TEMP/nsh.json"
          mv "$RUNNER_TEMP/nsh.json" nsh.json
          nsh update-manifest assets/spotish-"$version"-*.tar.gz assets/spotish-"$version"-*.zip --out assets
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum * > sha256sums
          cat sha256sums
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" * --clobber
          else
            gh release create "$GITHUB_REF_NAME" * --verify-tag --generate-notes --title "Spotish $GITHUB_REF_NAME"
          fi
